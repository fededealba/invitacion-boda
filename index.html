<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Federico & Hélène</title>
    <meta name="description"
        content="Wedding celebration of Federico & Hélène in Tequisquiapan, Mexico – March 7, 2026." />
    <meta property="og:title" content="Boda Federico & Hélène" />
    <meta property="og:description"
        content="Te esperamos en Tequisquiapan, México el 7 de Marzo, 2026 para celebrar la boda de Federico & Hélène." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fededealba.github.io/" />
    <meta property="og:image" content="https://fededealba.github.io/img/wallpaper.png" />
    <meta property="og:site_name" content="Boda Federico & Hélène" />
    <meta property="og:locale" content="es_MX" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="preload" as="image" href="assets/card.png">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="invitation-container">

        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope">
                <img src="assets/envelope.png" alt="Sobre" width="1280" height="932" />
            </div>
            <div class="card-container" id="cardContainer">
                <div class="card active" id="card1">
                    <img src="assets/card.png" alt="Invitación Boda Federico & Hélène" width="995" height="1280" />
                    <div class="scroll-arrow" id="scrollArrow">
                        <svg width="60" height="60" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 5L20 30M20 30L12 22M20 30L28 22" stroke="#FFFFFF" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>

                </div>
                <div class="card" id="card2">
                    <img src="assets/card2.png" alt="Detalles de la Boda" width="1244" height="1600" loading="lazy" />
                </div>
                <div class="card" id="card3">
                    <img src="assets/card3.png" alt="Card 3" width="1244" height="1600" loading="lazy" />
                    <a href="documents/Tequisquiapan_Hoteles.pdf" target="_blank" class="pdf-link"
                        aria-label="Más información sobre hoteles"></a>
                    <a href="https://wa.me/14155238886?text=join%20under-complete" target="_blank" class="whatsapp-link"
                        aria-label="Unirse al grupo de WhatsApp"></a>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn active" data-card="card1" aria-label="Ir a invitación">1</button>
        <button class="nav-btn" data-card="card2" aria-label="Ir a detalles">2</button>
        <button class="nav-btn" data-card="card3" aria-label="Ir a información">3</button>
    </div>

    <div class="swipe-arrow" id="swipeArrow">
        <svg width="60" height="60" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 20L30 20M30 20L22 12M30 20L22 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </div>

    <script src="script.js"></script>
</body>

</html>
